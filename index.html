<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>课程表 - 2026-2027学年第一学期</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",sans-serif;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(165deg,#eef1ff 0%,#f3ecff 42%,#e8fbf3 100%);min-height:100vh;padding:16px;color:#333a5c}
.wrap{max-width:1160px;margin:0 auto}
/* 顶部品牌区 */
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hero h1{font-size:clamp(19px,2.6vw,25px);color:#2d3354;display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#7c6cff,#5ea8ff);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;box-shadow:0 4px 12px rgba(124,108,255,.35)}
.badge{background:linear-gradient(135deg,#7c6cff,#5ea8ff);color:#fff;border-radius:20px;font-size:12px;padding:3px 11px;font-weight:600;letter-spacing:.3px}
.sub{color:#8a8fb5;font-size:13px}

/* 统计卡 */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.card{position:relative;overflow:hidden;background:rgba(255,255,255,.94);border-radius:16px;padding:13px 15px;box-shadow:0 4px 16px rgba(70,80,140,.07);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(6px)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#7c6cff,#5ea8ff);border-radius:0 3px 3px 0}
.card .k{color:#9aa0c4;font-size:12px;margin-bottom:4px}
.card .v{font-size:clamp(17px,2.2vw,20px);font-weight:800;color:#2d3354}
.card .v small{font-size:12px;color:#9aa0c4;font-weight:400}

/* 控制条 */
.controls{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.controls label{font-size:14px;color:#6a6f96}
.controls select{border:1px solid #dfe3f4;border-radius:12px;padding:8px 14px;font-size:14px;background:#fff;color:#2d3354;outline:none;box-shadow:0 2px 8px rgba(70,80,140,.06);cursor:pointer}
.controls .tip{color:#9aa0c4;font-size:12px}
.controls .today-chip{margin-left:auto;background:linear-gradient(135deg,#ff9f43,#ff7e5f);color:#fff;font-size:12px;font-weight:600;border-radius:20px;padding:5px 12px;display:none}
.controls .today-chip.show{display:inline-block}

/* ===== 桌面端课表（固定行高 → 块大小随节数） ===== */
.desktop{display:block}
.tbl-scroll{overflow:auto;-webkit-overflow-scrolling:touch;border-radius:18px;box-shadow:0 8px 26px rgba(70,80,140,.12);max-height:calc(100vh - 260px);background:#fff}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:880px;background:#fff}
thead th{position:sticky;top:0;z-index:3;background:linear-gradient(135deg,#7c6cff,#5ea8ff);color:#fff;padding:11px 6px;font-weight:600;font-size:13px;letter-spacing:.5px}
td.lesson,thead th:first-child{position:sticky;left:0;z-index:2;background:#f6f7ff}
thead th:first-child{z-index:4;background:linear-gradient(135deg,#6b5be8,#4f96e8)}
thead th.todayhead{background:linear-gradient(135deg,#ff9f43,#ff7e5f)}
th,td{border-bottom:1px solid #edf0fa;border-right:1px solid #edf0fa;text-align:center;vertical-align:middle;height:46px}
tbody tr{height:46px}
thead th:last-child,td:last-child{border-right:none}
tbody tr:last-child td{border-bottom:none}
td.lesson{color:#6a6f96;font-weight:700;font-size:13px;padding:0 4px;min-width:66px}
td.lesson .tspan{display:block;color:#a9adcc;font-size:11px;font-weight:400;margin-top:2px;white-space:nowrap}
td.cell-today{background:#fff6ea!important}
td.cell-other{background:#fff}
/* 课程块：占满整行 rowspan 高度，大小与节数成正比 */
.course{position:relative;margin:3px 4px;padding:8px 9px 8px 14px;border-radius:12px;height:calc(100% - 6px);min-height:42px;display:flex;flex-direction:column;justify-content:center;gap:3px;border:1px solid rgba(90,100,180,.07);box-shadow:0 2px 6px rgba(70,80,140,.05)}
.course::before{content:"";position:absolute;left:0;top:18%;bottom:18%;width:4px;border-radius:4px;background:var(--acc)}
.course .t{font-weight:700;font-size:13px;color:#3a3f63;word-break:break-word;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.course .tm{font-size:11px;color:#5c6390;font-weight:600}
.course .rm{font-size:11px;color:#7a80a8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course .tc{font-size:10.5px;color:#9096b8}
.course.past{filter:grayscale(.75);opacity:.5}
.empty{color:#e4e7f5;font-size:13px}
/* 课程调色板（浅底 + 强调色） */
.c0{--acc:#7c6cff;background:linear-gradient(135deg,#ece9ff,#f4f1ff)}.c1{--acc:#3e8de3;background:linear-gradient(135deg,#e0f0ff,#eaf6ff)}
.c2{--acc:#36a57f;background:linear-gradient(135deg,#dff6ec,#eafbf3)}.c3{--acc:#ef7a4d;background:linear-gradient(135deg,#ffe7db,#fff1e9)}
.c4{--acc:#e2a93b;background:linear-gradient(135deg,#fff4d8,#fff9e8)}.c5{--acc:#e45e9c;background:linear-gradient(135deg,#ffe2ef,#fff0f7)}
.c6{--acc:#2f9fce;background:linear-gradient(135deg,#dff3ff,#ecf9ff)}.c7{--acc:#86a63b;background:linear-gradient(135deg,#eff5d8,#f5f9e6)}

.legend{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.legend .lb{flex:1;min-width:200px;background:rgba(255,255,255,.9);border-radius:12px;padding:10px 14px;font-size:12px;color:#6a6f96;border-left:4px solid;box-shadow:0 2px 8px rgba(70,80,140,.04)}
.legend .lb b{display:block;color:#2d3354;font-size:13px;margin-bottom:2px}
.lb.a{border-color:#7c6cff}.lb.b{border-color:#5ea8ff}.lb.c{border-color:#ff9f43}

/* ===== 手机端：竖向时间轴（块高 ∝ 节数） ===== */
.mobile{display:none}
.m-days{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.m-days::-webkit-scrollbar{display:none}
.m-day{flex:0 0 auto;min-width:62px;text-align:center;background:rgba(255,255,255,.95);border-radius:14px;padding:9px 6px;box-shadow:0 2px 8px rgba(70,80,140,.08);cursor:pointer;border:2px solid transparent;transition:all .15s}
.m-day .dw{font-size:12px;color:#8b8fb5}
.m-day .dd{font-size:13px;font-weight:700;color:#2d3354;margin-top:2px}
.m-day.on{border-color:#ff9f43;background:#fff6ea;transform:translateY(-1px)}
.m-day.on .dw{color:#d97b1f}
.m-day.today-mark{position:relative}
.m-day.today-mark::after{content:"今";position:absolute;top:-6px;right:-4px;background:#ff9f43;color:#fff;font-size:10px;font-weight:600;border-radius:8px;padding:0 5px}
.m-list{display:none}
.m-list.on{display:block}
.m-empty-card{background:rgba(255,255,255,.95);border-radius:16px;padding:30px 16px;text-align:center;color:#b3b8d6;font-size:14px;box-shadow:0 4px 14px rgba(70,80,140,.06)}
/* 时间轴主体 */
.m-axis{display:flex;background:rgba(255,255,255,.6);border-radius:18px;padding:10px 6px 10px 0;box-shadow:0 6px 20px rgba(70,80,140,.08)}
.m-times{flex:0 0 56px;position:relative;height:var(--ah,1020px)}
.m-tick{position:absolute;right:6px;transform:translateY(-3px);font-size:10px;color:#a3a8c6;white-space:nowrap;text-align:right;line-height:1.25}
.m-tick .n{display:block;font-size:9px;color:#c7cce8;line-height:1}
.m-track{flex:1;position:relative;height:var(--ah,1020px);border-left:1px solid #e8ebf7}
.m-guide{position:absolute;left:0;right:0;top:0;height:1px;background:#eef0f9}
.m-block{position:absolute;left:6px;right:8px;border-radius:12px;padding:2px 9px;border:1px solid rgba(90,100,180,.06);box-shadow:0 2px 8px rgba(70,80,140,.06);display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.m-block::before{content:"";position:absolute;left:0;top:16%;bottom:16%;width:4px;border-radius:4px;background:var(--acc)}
.m-block .t{font-weight:700;font-size:13px;color:#3a3f63;line-height:1.3;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m-block .tm{font-size:10.5px;color:#5c6390;font-weight:600}
.m-block .rm{font-size:10.5px;color:#7a80a8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-block .tc{font-size:10px;color:#9096b8}
.m-block.past{filter:grayscale(.75);opacity:.5}

@media(max-width:760px){
  body{padding:10px}
  .cards{grid-template-columns:repeat(2,1fr);gap:10px}
  .desktop{display:none}
  .mobile{display:block}
  .legend .lb{min-width:100%}
  .controls .today-chip{margin-left:0}
  .tbl-scroll{max-height:none}
}
</style>
</head>
